name: CD

# Runs only on push (i.e. after a merge lands) to dev or main.
# Never fires on raw feature-branch pushes — only once a PR is actually merged.
on:
  push:
    branches: [dev, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }} # e.g. yourteam/task-manager

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # needed to push images to GitHub Container Registry

    steps:
      - uses: actions/checkout@v4

      # main -> tagged "latest" (your stable/demo build)
      # dev  -> tagged "dev"    (your integration/staging build)
      - name: Set image tag
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # auto-provided by GitHub, no setup needed

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend:${{ steps.vars.outputs.tag }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backend:${{ steps.vars.outputs.tag }}

      # --- Optional deploy step ---
      # Add this once you decide where the demo actually runs (a VM you SSH into,
      # a free-tier host, or just `docker-compose pull && up` locally on demo day).
      # Example if you have a server reachable over SSH:
